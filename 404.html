<script>
// Alte Adressen (z. B. /Ubongo/public/) automatisch zur Spiel-Wurzel umleiten.
(function () {
  var parts = location.pathname.split('/');
  var root = parts.length > 1 && parts[1] ? '/' + parts[1] + '/' : '/';
  location.replace(root);
})();
</script>
